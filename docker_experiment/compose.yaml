x-context: radboud

services:
  sjoerd-experiment-db:
    image: postgres:17
    environment:
      POSTGRES_DB: experiment
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - experiment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experiment -d experiment"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sjoerd-experiment-app:
    build: .
    x-ports:
      - icis.sys-eco-exp.u.science.ru.nl:8501/https
    environment:
      DATABASE_URL: postgresql://experiment:${POSTGRES_PASSWORD}@sjoerd-experiment-db:5432/experiment
      SCIENCE_LLM_API_KEY: ${SCIENCE_LLM_API_KEY}
    depends_on:
      - sjoerd-experiment-db
    restart: unless-stopped

volumes:
  experiment_data:
